[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage"
dynamic = ["version"]
description = "Sensor rig planner for autonomous-driving data collection: place cameras on a vehicle, prove what they record, calibrate them from live streams"
readme = "README.md"
license = { text = "GPL-3.0-or-later AND Apache-2.0" }   # Apache-2.0: vantage/runtime (the reference stitchers)
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "PyOpenGL>=3.1",
    "PyYAML>=6.0",
    "opencv-python>=4.7",
    "certifi",
    "tzdata; sys_platform == 'win32'",     # named time zones (sun glare studies): Windows has no system database
]

[project.optional-dependencies]
step = ["gmsh"]
keyring = ["keyring"]
claude = ["anthropic>=2.3,<3"]   # the assistant's Claude provider (Anthropic's official SDK); Groq needs nothing
bags = ["zstandard", "lz4"]       # read and write compressed ROS 2 bags (MCAP chunks); uncompressed bags need nothing
test = ["pytest"]

[project.urls]
Homepage = "https://sherin-sef-ai.github.io/Vantage/"
Source = "https://github.com/Sherin-SEF-AI/Vantage"
Releases = "https://github.com/Sherin-SEF-AI/Vantage/releases"
Changelog = "https://github.com/Sherin-SEF-AI/Vantage/blob/main/CHANGELOG.md"

# `vantage` works everywhere (window, batch mode, --self-test); `vantage-gui` starts the window without a console
# window on Windows, where a console launcher would otherwise open one next to the app.
[project.scripts]
vantage = "vantage.app:main"

[project.gui-scripts]
vantage-gui = "vantage.app:main"

[tool.setuptools.dynamic]
version = { attr = "vantage.__version__" }

[tool.setuptools.packages.find]
include = ["vantage", "vantage.*"]

[tool.setuptools.package-data]
vantage = [
    "resources/fonts/*.ttf",
    "resources/fonts/OFL.txt",
    "resources/icons/*.png",
    "runtime/CMakeLists.txt",
    "runtime/*.cpp",
    "runtime/README.md",
    "runtime/LICENSE",
]

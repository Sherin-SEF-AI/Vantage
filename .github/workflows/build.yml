# Builds the downloadable Vantage bundles (Linux x86_64 and arm64 tar.gz, Windows installer + zip, macOS app zip),
# smoke-tests each one (--version, a batch analysis, --self-test with every check passing) and keeps them as workflow
# artifacts. On a version tag (git tag v0.1.1 && git push origin v0.1.1) it then publishes them as that version's
# GitHub release with SHA256SUMS.txt and the CHANGELOG entry as release notes, but only when every bundle passed.
# Also runs by hand (Actions > Build installers > Run workflow): bundles as artifacts, no release.
name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported Ubuntu, so the Linux bundle runs on as many distributions as possible (glibc 2.35+);
        # ubuntu-22.04-arm builds the Linux arm64 bundle on the Ubuntu NVIDIA's JetPack 6 is based on (Jetson Orin);
        # macos-15 runs on Apple silicon, so the macOS app is arm64 (GitHub retires macos-14 on 2026-11-02; no wheel
        # the bundle carries needs more than macOS 14, so the app still runs on 14)
        os: [ubuntu-22.04, ubuntu-22.04-arm, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements-bundle.txt

      - name: Check the tag, the version and the CHANGELOG agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python packaging/release.py notes --tag "${GITHUB_REF_NAME}" > /dev/null

      - name: Qt and OpenGL libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Qt's X11 plugin needs these xcb libraries; PyInstaller bundles the ones it finds here (X11 desktops often
          # lack libxcb-cursor0). Mesa (EGL, llvmpipe) lets the self-test draw with OpenGL without a GPU or display.
          # GStreamer: the self-test runs a camera pipeline through the system's gst-launch-1.0, as on a Jetson (the
          # bundle's OpenCV has no GStreamer of its own).
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libegl-mesa0 libgl1-mesa-dri \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-sync1 libxcb-shm0 libx11-xcb1 libfontconfig1 libdbus-1-3 libglib2.0-0 \
            gstreamer1.0-tools gstreamer1.0-plugins-base

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-bundle.txt

      - name: Packaging tests (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install pytest
          python -m pytest -q -p no:cacheprovider tests/test_packaging.py

      - name: Build, smoke-test and pack
        run: python packaging/build.py --smoke

      - uses: actions/upload-artifact@v4
        with:
          name: vantage-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  # on a version tag, once every bundle above built and passed its smoke test: the GitHub release with the bundles,
  # their checksums and the CHANGELOG entry
  release:
    if: success() && startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          cd dist
          ls -la
          n=$(ls | wc -l)
          if [ "$n" -lt 5 ]; then echo "expected the two Linux, Windows (zip and setup) and macOS files, got $n" >&2; exit 1; fi
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          python3 packaging/release.py notes --tag "${GITHUB_REF_NAME}" > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python3 packaging/release.py version)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # a re-run: replace the files, keep the notes as they are
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            # gh creates the release as a draft, uploads the files and then publishes it, so the release never
            # shows without its downloads
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Vantage $VERSION" --notes-file notes.md
          fi

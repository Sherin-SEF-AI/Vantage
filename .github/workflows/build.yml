# Builds the downloadable Vantage bundles (Linux tar.gz, Windows installer + zip, macOS app zip), smoke-tests each
# one (--version, a batch analysis, --self-test) and keeps them as workflow artifacts.
# Runs on version tags (git tag v1.0.0 && git push origin v1.0.0) and by hand (Actions > Build installers > Run).
name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        # the oldest supported Ubuntu, so the Linux bundle runs on as many distributions as possible (glibc 2.35+);
        # macos-14 runs on Apple silicon, so the macOS app is arm64
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Qt and OpenGL libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libxcb-cursor0 is bundled for Qt's X11 plugin (X11 desktops often lack it); Mesa runs the self-test's
          # OpenGL check headless
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libegl-mesa0 libgl1-mesa-dri \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build, smoke-test and pack
        run: python packaging/build.py --smoke

      - uses: actions/upload-artifact@v4
        with:
          name: vantage-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error
